name = "video-cleaner"
main = "worker.js"
compatibility_date = "2026-10-07"

# 你的 Cloudflare 账户 ID（从部署报错路径里可见：/accounts/<此ID>/containers/me）
# 本地 wrangler deploy 时需要；Workers Builds 会自动使用连接账户的 ID。
account_id = "afed256f7442d999a9f0916d0087528e"

# ⚠️ 硬门槛：Cloudflare Containers 仅限 Workers Paid 付费计划（$5/月）。
# 账户必须已升级 Workers Paid，且 containers.enabled 权限已生效，
# 否则部署到 /accounts/<id>/containers/me 这一步会直接报
# "A request to the Cloudflare API (/accounts/.../containers/me) failed"。

# 容器定义：镜像 + 关联的 Durable Object 类
[[containers]]
class_name = "VideoCleaner"
image = "./Dockerfile"
# 全部流量都路由到同一个 "shared" 实例，所以这里锁 1 个即可
max_instances = 1
# 实例规格：视频转码 / OpenCV 偏 CPU 与内存
#   standard-3 = 2 vCPU / 8 GiB / 16 GB（推荐起点）
#   若 OOM 或需更快，升到 standard-4（4 vCPU / 12 GiB / 20 GB）
#   更小规格（lite/basic/standard-1）跑 Chromium + ffmpeg 容易内存不足
instance_type = "standard-3"

# 让 Worker 能拿到容器命名空间
[[durable_objects.bindings]]
name = "VIDEO_CLEANER"
class_name = "VideoCleaner"

# 声明 Durable Object 类（带 SQLite 存储，用于容器元状态）
[exports.VideoCleaner]
type = "durable-object"
storage = "sqlite"
